name: Android Test

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud's new-code/PR analysis needs full history, not a shallow clone.
          fetch-depth: 0

      - name: Set up JDK 21
        # This is just the JDK Gradle/the SonarCloud scanner run under — the app itself still
        # targets Java 17 bytecode via compileOptions/kotlinOptions, unaffected by this. Required
        # because SonarQube Cloud's scanner no longer supports running under Java 17.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        # local.properties is gitignored (real Supabase credentials) and BuildConfig reads it
        # at build time. These tests override every Supabase-touching dependency and never call
        # real endpoints (they only need the client to construct without crashing), so a
        # placeholder is enough — no real secrets needed for this workflow.
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "SUPABASE_URL=https://placeholder.supabase.co" >> local.properties
          echo "SUPABASE_KEY=placeholder" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests with coverage
        run: ./gradlew testDebugUnitTest jacocoTestReport

      - name: Publish per-test results
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: Android Test Results
          path: app/build/test-results/testDebugUnitTest/*.xml
          reporter: java-junit

      - name: SonarCloud Scan
        # Skips cleanly instead of failing CI on forks/PRs that can't see the secret.
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar
